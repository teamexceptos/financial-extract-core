[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "bill-extractor-core"
version = "0.1.0"
description = "Bill extractor core — FastAPI service with Rust extensions"
requires-python = ">=3.9"
authors = [{ name = "Verime" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "python-multipart>=0.0.6",
    "python-dateutil>=2.8.2,<3.0",
    "passlib>=1.7.4,<2.0",
    "tqdm>=4.65.0,<5.0.0",
    "joblib>=1.3.0,<2.0.0",
    "PyPDF2>=3.0.0,<4.0.0",
    "pdfplumber>=0.11.8",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "Pillow>=10.0,<12.0",
    "python-dotenv>=0.19.0,<1.0.0",
    "pdf-inspector>=0.2.5",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "bill_extractor_core"
